site_name: Macro Monitor · Base de conocimiento
site_url: https://jmm-mlg.github.io/Macro-daily/kb/
docs_dir: kb
site_dir: docs/kb
use_directory_urls: true
exclude_docs: 'verificar.py

  verificacion.yaml

  build_nav.py

  _hooks.py

  '
theme:
  name: material
  language: es
  palette:
  - scheme: default
    primary: blue grey
    accent: amber
    toggle:
      icon: material/brightness-7
      name: Modo oscuro
  - scheme: slate
    primary: blue grey
    accent: amber
    toggle:
      icon: material/brightness-4
      name: Modo claro
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - search.suggest
  - search.highlight
  - content.tabs.link
  - toc.integrate
markdown_extensions:
- tables
- admonition
- toc
- attr_list
- md_in_html
- pymdownx.superfences: {}
plugins:
- search:
    lang: es
hooks:
- kb/_hooks.py
