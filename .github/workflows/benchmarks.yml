name: Benchmarks de industria (Damodaran)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 15 1 *"   # 15 de enero: Damodaran actualiza en la primera quincena

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar Damodaran y regenerar benchmarks
        run: python kb/benchmarks/actualizar.py
      - name: Guardar
        run: |
          git config user.name "macro-monitor bot"
          git config user.email "actions@github.com"
          git add kb/benchmarks
          git diff --cached --quiet || git commit -m "kb: benchmarks de industria $(date -u +%F)"
          git push
