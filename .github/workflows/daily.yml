name: Macro daily

on:
  schedule:
    # 05:30 UTC = 07:30 CEST / 06:30 CET, de lunes a viernes.
    # GitHub puede retrasar el cron 10-30 min en horas punta.
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # para commitear docs/macro.ics

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Informe diario
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python run.py daily
      - name: Publicar calendarios e histórico
        run: |
          git config user.name "macro-monitor bot"
          git config user.email "actions@github.com"
          git add docs/*.ics data/
          git diff --cached --quiet || git commit -m "daily: $(date -u +%F)"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: macro-daily
          path: output/
          retention-days: 30
